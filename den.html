      navMenu.classList.remove('is-open');

    const layoutPositions = [
      { top: '16%', left: '7%', rot: -7 }, // Resurrection - moved down comfortably clear of header
      { top: '4%', left: '28%', rot: 4 },
      { top: '13%', left: '48%', rot: -3 }, // Hugging above clock
      { top: '5%', left: '68%', rot: 6 },
      { top: '6%', left: '87%', rot: -6 },
      { top: '26%', left: '77%', rot: 5 }, // Hugging right of title
      { top: '41%', left: '73%', rot: -4, isLarge: true }, // Elf Barighian (vape) - LARGER
      { top: '58%', left: '87%', rot: 7 },
      { top: '78%', left: '77%', rot: -5 },
      { top: '67%', left: '54%', rot: 4, isLarge: true }, // Columbia ADP - LARGER
      { top: '67%', left: '36%', rot: -6 }, // Hugging bottom left of hint
      { top: '80%', left: '21%', rot: 5 },
      { top: '73%', left: '4%', rot: -7, isLarge: true }, // Audio Reactive Visualizer - LARGER
      { top: '56%', left: '4%', rot: 6 },
      { top: '43%', left: '17%', rot: -4 }, // Hugging left of text
      { top: '24%', left: '19%', rot: 5 }, // Hugging upper left of title
      { top: '65%', left: '14%', rot: -3 }
    ];

    let currentModalIndex = 0;
    const playground = document.getElementById('playground');
    const modalOverlay = document.getElementById('projectModalOverlay');

    function renderCrowdedStickers() {
      // Remove any existing sticker items
      document.querySelectorAll('.sticker-item').forEach(e => e.remove());

      const isMobile = window.innerWidth <= 768;

      projects.forEach((proj, idx) => {
        const pos = layoutPositions[idx % layoutPositions.length];
        const el = document.createElement('div');
        el.className = 'sticker-item' + (pos.isLarge ? ' is-large' : '');
        el.dataset.index = idx;

        if (!isMobile) {
          el.style.top = pos.top;
          el.style.left = pos.left;
          el.style.transform = `rotate(${pos.rot}deg)`;
        } else {
          el.style.transform = `rotate(${pos.rot}deg)`;
        }

        el.style.zIndex = idx + 1;

        el.innerHTML = `
          <img class="sticker-img" src="${proj.image}" alt="${proj.title}" loading="lazy" />
        `;

        el.addEventListener('click', () => {
          openModal(idx);
        });

        playground.appendChild(el);
      });
    }

    // Modal logic
    function openModal(index) {
      currentModalIndex = index;
      const proj = projects[index];
      if (!proj) return;

      document.getElementById('modalImage').src = proj.image;
      document.getElementById('modalImage').alt = proj.title;
      document.getElementById('modalTitle').textContent = proj.title;
      document.getElementById('modalCategory').textContent = proj.category;
      document.getElementById('modalYear').textContent = proj.year;
      document.getElementById('modalDesc').innerHTML = proj.description || '';

      const bodyEl = document.getElementById('modalBody');
      if (proj.body && proj.body.trim()) {
        bodyEl.innerHTML = proj.body;
        bodyEl.style.display = 'block';
      } else {
        bodyEl.innerHTML = '';
        bodyEl.style.display = 'none';
      }

      const linkBtn = document.getElementById('modalLink');
      const linkText = document.getElementById('modalLinkText');
      if (proj.link && proj.link.trim()) {
        linkBtn.href = proj.link;
        linkText.textContent = proj.linkText || 'Open Project';
        linkBtn.style.display = 'inline-flex';
      } else {
        linkBtn.style.display = 'none';
      }

      modalOverlay.classList.add('is-open');
    }

    function closeModal() {
      modalOverlay.classList.remove('is-open');
    }

    function nextProject() {
      currentModalIndex = (currentModalIndex + 1) % projects.length;
      openModal(currentModalIndex);
    }

    function prevProject() {
      currentModalIndex = (currentModalIndex - 1 + projects.length) % projects.length;
      openModal(currentModalIndex);
    }

    // Event listeners
    document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
    document.getElementById('modalNextBtn').addEventListener('click', nextProject);
    document.getElementById('modalPrevBtn').addEventListener('click', prevProject);

    modalOverlay.addEventListener('click', (e) => {
      if (e.target === modalOverlay) closeModal();
    });

    window.addEventListener('keydown', (e) => {
      if (!modalOverlay.classList.contains('is-open')) return;
      if (e.key === 'Escape') closeModal();
      if (e.key === 'ArrowRight') nextProject();
      if (e.key === 'ArrowLeft') prevProject();
    });

    window.addEventListener('resize', () => {
      renderCrowdedStickers();
    });

    document.addEventListener('DOMContentLoaded', renderCrowdedStickers);
  </script>
</body>

</html>
