<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TINA TARIGHIAN</title>
  <link rel="apple-touch-icon" sizes="180x180" href="img/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="img/favicon-16x16.png" />
  <link rel="manifest" href="img/site.webmanifest" />
  <!-- Add Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <!-- Add Google Symbols -->
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=arrows_more_up" />

  <style>
    body {
      background: linear-gradient(to bottom, white, #999 258.64%);
      font-family: 'Inter', sans-serif;
      margin: 0;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      position: relative;
    }

    /* Center Title */
    .title {
      margin-top: 100px;
      font-size: 200px;
      font-weight: normal;
      line-height: 0.89;
      color: black;
      text-align: center;
      position: relative;
      z-index: 1;
      /* Lower than images */
    }

    .clickable {
      color: black;
      cursor: pointer;
      animation: blink 1s infinite;
      text-decoration: none;
    }

    .clickable:hover {
      color: red;
      animation: none;
    }

    @keyframes blink {

      0%,
      100% {
        color: blue;
      }

      50% {
        color: black;
      }
    }

    /* Old Center Images Sizing and Placement */
    .images {
      position: absolute;
      bottom: -20px;
      left: 50%;
      transform: translateX(-50%) scale(2.0);
      /* Reduced from 2.3 */
      transform-origin: bottom center;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      z-index: 5;
      /* Higher than title */
      pointer-events: none;
      /* Allow clicks to pass through to title */
    }

    .images>div {
      display: flex;
      align-items: flex-end;
      position: relative;
    }

    #handImage,
    #bunnyImage {
      animation: bounce 1s ease-in-out infinite, wiggle 3s ease-in-out infinite;
    }

    #handImage {
      animation-delay: 0s, 0.5s;
    }

    #bunnyImage {
      animation-delay: 0.5s, 0s;
    }

    @keyframes bounce {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-5px);
      }
    }

    @keyframes wiggle {

      0%,
      100% {
        transform: rotate(0deg);
      }

      25% {
        transform: rotate(1deg);
      }

      75% {
        transform: rotate(-1deg);
      }
    }

    /* Sidebar Buttons - Anchored to viewport left with gaps from Figma */
    .sidebar {
      position: fixed;
      left: 0;
      bottom: 0;
      display: flex;
      flex-direction: column-reverse;
      align-items: flex-start;
      gap: 11px;
      /* Calculated from Figma metadata */
      z-index: 10;
    }

    .nav-box {
      border: 3px dashed black;
      display: flex;
      align-items: center;
      padding: 6px;
      /* 6px on all sides */
      box-sizing: border-box;
      font-size: 16px;
      /* Significantly reduced size */
      color: black;
      text-decoration: none;
      font-weight: normal;
    }

    .nav-box.boring {
      background-color: #ffbee7;
    }

    .nav-box.rn {
      background-color: red;
    }


    .nav-box span {
      margin-right: 0;
    }

    .nav-box .arrow {
      margin-left: auto;
      font-family: 'Google Symbols', sans-serif;
      font-size: 24px;
    }

    .nav-box:hover {
      filter: brightness(0.9);
    }

    .label {
      display: none;
      background-color: rgb(255, 255, 0);
      padding: 5px;
      position: absolute;
      z-index: 100;
      pointer-events: none;
      font-size: 60px;
      white-space: nowrap;
    }


    .material-symbols-outlined {
      font-variation-settings:
        'FILL' 0,
        'wght' 400,
        'GRAD' 0,
        'opsz' 24;
      font-size: 12px;
      /* Font size 12 as requested */
      position: relative;
      top: -4px;
      /* Superscript effect */
    }

    /* Modal Styles */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      /* No shadow */
      z-index: 20;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background-color: red;
      border: 7px dashed black;
      width: 700px;
      /* Smaller width */
      height: 500px;
      /* Smaller height */
      position: relative;
      padding: 0;
      /* Remove padding to make header edge-to-edge */
      box-sizing: border-box;
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      max-width: 90vw;
      max-height: 90vh;
      overflow: hidden;
      /* Keep overflow hidden for content box, scroll body instead */
    }

    .modal-close {
      position: absolute;
      top: -7px;
      /* Flush with corner */
      right: -7px;
      /* Flush with corner */
      width: 60px;
      /* Proportional size */
      height: 60px;
      /* Proportional size */
      background-color: red;
      border: 7px dashed black;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      /* Proportional font size */
      color: black;
      cursor: pointer;
      box-sizing: border-box;
      z-index: 10;
      /* Ensure it's above the header */
    }

    .modal-header {
      font-size: 54px;
      margin-bottom: 0;
      white-space: nowrap;
      overflow: hidden;
      background-color: red;
      width: 100%;
      box-sizing: border-box;
    }

    .ticker {
      display: inline-block;
      animation: ticker 10s linear infinite;
    }

    .ticker span {
      display: inline-block;
    }

    @keyframes ticker {
      0% {
        transform: translateX(0);
      }

      100% {
        transform: translateX(-50%);
      }
    }

    .modal-body {
      font-size: 12px;
      /* Blurb size */
      line-height: 1.4;
      padding: 10px 40px 40px 40px;
      /* Decreased top padding */
      overflow-y: auto;
      flex: 1;
      scrollbar-width: none;
      /* Firefox */
      -ms-overflow-style: none;
      /* IE and Edge */
    }

    .modal-body::-webkit-scrollbar {
      display: none;
      /* Chrome, Safari, Opera */
      width: 0;
      height: 0;
    }

    .modal-body ul {
      list-style-type: none;
      margin-left: 0;
      padding-left: 0;
    }

    .modal-body li {
      margin-bottom: 15px;
    }

    .modal-body li span {
      font-size: 22px;
      /* Event Title size */
      font-weight: bold;
      text-transform: uppercase;
    }

    .modal-body>p {
      font-size: 12px;
      /* Blurb size */
      margin-left: 0;
      margin-top: 5px;
    }

    .modal-body li p {
      font-size: 18px;
      /* Event Description size */
      margin-left: 0;
      margin-top: 5px;
    }
  </style>
</head>

<body>
  <div class="title">
    TIN<a class="clickable" href="about.html" onmouseover="showLabel('A', 'about')"
      onmouseout="hideLabel('A')">A</a>.zone
  </div>

  <div class="images">
    <div>
      <img src="splash/hand.webp" alt="hand" id="handImage"
        style="position: relative; z-index: 2; filter: brightness(100%); align-self: flex-end;" />
      <a href="work.html" id="handLink">
        <div id="handHoverArea"
          style="position: absolute; top: 80px; right: 100px; width: 100%; height: 100%; scale:0.2 0.5; z-index: 3; pointer-events: auto;">
        </div>
      </a>
      <img src="splash/bunny.webp" alt="bunny" id="bunnyImage"
        style="position: absolute; top: 31px; left: 50px; z-index: 1; filter: brightness(100%);" />
      <a href="art.html" id="bunnyLink">
        <div id="bunnyHoverArea"
          style="position: absolute; top: -10px; left: 110px; scale:0.2 0.5; width: 100%; height: 100%; z-index: 3; pointer-events: auto;">
        </div>
      </a>
    </div>
  </div>

  <div class="sidebar">
    <a href="boringversion.html" class="nav-box boring">
      <span>boring version</span>
      <span class="material-symbols-outlined">arrows_more_up</span>
    </a>
    <a href="#" class="nav-box rn">
      <span>RN</span>
      <span class="material-symbols-outlined">arrows_more_up</span>
    </a>
  </div>

  <div class="label" id="label">Title</div>

  <!-- RN Modal -->
  <div class="modal-overlay" id="rnModalOverlay">
    <div class="modal-content">
      <div class="modal-close" id="closeModal">X</div>
      <div class="modal-header">
        <div class="ticker">
          <span>RIGHT NOW RIGHT NOW RIGHT NOW RIGHT NOW RIGHT NOW RIGHT NOW RIGHT NOW RIGHT NOW </span>
          <span>RIGHT NOW RIGHT NOW RIGHT NOW RIGHT NOW RIGHT NOW RIGHT NOW RIGHT NOW RIGHT NOW </span>
        </div>
      </div>
      <div class="modal-body" id="modalBody">
        <!-- Loaded dynamically from Google Sheets or JSON -->
      </div>
    </div>
  </div>



  <script>
    // ============================================================
    // GOOGLE SHEETS CONFIGURATION FOR "RN" (RIGHT NOW)
    // ============================================================
    // How to connect your Google Sheet:
    // 1. Create a Google Sheet with 3 columns:
    //      - Title (or Event / Project)
    //      - Description (or Details / Info)
    //      - Link (URL, optional)
    //    Optional: Add an "Intro" row with Title = "Intro" and Description = "Your intro message"
    // 2. In Google Sheets: Click "Share" -> change General access to "Anyone with the link can view"
    // 3. Paste the Sheet ID or full Google Sheet link below:
    const GOOGLE_SHEET_ID_OR_URL = 'https://docs.google.com/spreadsheets/d/1_cWMuByNoaVtMNV8bSlZ0D_cg0EerDHAvXv5Ly07U8A/edit?usp=sharing';
    const GOOGLE_SHEET_TAB_NAME = '';  // Optional sheet/tab name (e.g. 'Sheet1' or 'RN')

    // Default sample data displayed if no Google Sheet is connected yet or when offline
    const DEFAULT_RN_DATA = {
      intro: "Currently working on upcoming exhibitions and projects. Follow along on [instagram](https://www.instagram.com/).",
      events: [
        {
          title: "Upcoming Project",
          description: "Connect your Google Sheet in index.html to update this list automatically.",
          link: ""
        }
      ]
    };

    // Mobile detection and redirect
    function isMobile() {
      return window.innerWidth <= 767 ||
        /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
    }

    if (isMobile()) {
      window.location.replace("mobile-splash.html");
    }

    // Label functions
    function showLabel(letter, title) {
      const label = document.getElementById("label");
      label.textContent = title;
      const rect = event.target.getBoundingClientRect();
      label.style.left = rect.right + 5 + "px";
      label.style.top = rect.bottom + 5 + "px";
      label.style.display = "block";
    }

    function hideLabel(letter) {
      const label = document.getElementById("label");
      label.style.display = "none";
    }

    // Hover effects
    function handleImageHover(event, imageId, hoverSrc, normalSrc, bgColor) {
      const image = document.getElementById(imageId);
      image.src = hoverSrc;
      document.body.style.background = bgColor;
    }

    function handleImageLeave(imageId, normalSrc) {
      const image = document.getElementById(imageId);
      image.src = normalSrc;
      document.body.style.background = 'linear-gradient(to bottom, white, #999 258.64%)';
    }

    // Helper to format text with clickable URLs or markdown links
    function formatTextWithLinks(text) {
      if (!text) return '';
      if (/<a\s+href=/i.test(text)) return text;
      // Convert markdown links [text](url) -> <a>
      let formatted = text.replace(/\[([^\]]+)\]\((https?:\/\/[^\s\)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer" style="color: inherit; text-decoration: underline;">$1</a>');
      // Convert naked URLs -> <a>
      formatted = formatted.replace(/(^|[^"'>\/])(https?:\/\/[^\s<]+)/g, '$1<a href="$2" target="_blank" rel="noopener noreferrer" style="color: inherit; text-decoration: underline;">$2</a>');
      return formatted;
    }

    // Parse Google Visualization API JSON response
    function parseGvizResponse(rawText) {
      const match = rawText.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\);?/);
      const jsonStr = match ? match[1] : rawText.substring(rawText.indexOf('{'), rawText.lastIndexOf('}') + 1);
      const data = JSON.parse(jsonStr);
      const table = data.table;
      if (!table) return { intro: '', events: [] };

      const cols = table.cols || [];
      const rows = table.rows || [];

      let headers = cols.map(c => (c && c.label ? c.label.toLowerCase().trim() : ''));
      let dataRows = rows;

      const hasNamedCols = headers.some(h => h.includes('title') || h.includes('desc') || h.includes('link') || h.includes('url') || h.includes('event') || h.includes('name'));

      if (!hasNamedCols && rows.length > 0) {
        const firstRowVals = (rows[0].c || []).map(cell => (cell && cell.v !== null && cell.v !== undefined ? String(cell.v).toLowerCase().trim() : ''));
        if (firstRowVals.some(v => v.includes('title') || v.includes('desc') || v.includes('link') || v.includes('url') || v.includes('event') || v.includes('name'))) {
          headers = firstRowVals;
          dataRows = rows.slice(1);
        }
      }

      let titleIdx = headers.findIndex(h => h.includes('title') || h.includes('event') || h.includes('name') || h.includes('project'));
      let descIdx = headers.findIndex(h => h.includes('desc') || h.includes('detail') || h.includes('text') || h.includes('blurb') || h.includes('info') || h.includes('notes'));
      let linkIdx = headers.findIndex(h => h.includes('link') || h.includes('url') || h.includes('href') || h.includes('site') || h.includes('website'));

      if (titleIdx === -1) titleIdx = 0;
      if (descIdx === -1) descIdx = 1;
      if (linkIdx === -1) linkIdx = 2;

      let intro = '';
      const events = [];

      dataRows.forEach(r => {
        if (!r || !r.c) return;
        const getVal = (idx) => (r.c[idx] && r.c[idx].v !== null && r.c[idx].v !== undefined) ? String(r.c[idx].v).trim() : '';
        const title = getVal(titleIdx);
        const desc = getVal(descIdx);
        let link = getVal(linkIdx);

        if (!title && !desc) return;

        // Clean link if it contains extra placeholder text or non-URL string
        const urlMatch = link ? link.match(/https?:\/\/[^\s\)]+/) : null;
        if (urlMatch) {
          link = urlMatch[0];
        } else if (!link.startsWith('/') && !link.startsWith('mailto:')) {
          link = '';
        }

        const tLower = title.toLowerCase();
        if (tLower.startsWith('intro') || tLower.startsWith('[intro]') || tLower.startsWith('blurb') || tLower.startsWith('about')) {
          intro = desc || title;
        } else {
          events.push({ title, description: desc, link });
        }
      });

      return { intro, events };
    }

    // Event listeners
    document.addEventListener('DOMContentLoaded', function () {
      document.getElementById('handHoverArea').addEventListener('mouseover', (event) => {
        handleImageHover(event, 'handImage', 'splash/handhover.webp', 'splash/hand.webp', '#fffc00');
      });

      document.getElementById('handHoverArea').addEventListener('mouseout', () => {
        handleImageLeave('handImage', 'splash/hand.webp');
      });

      document.getElementById('bunnyHoverArea').addEventListener('mouseover', (event) => {
        handleImageHover(event, 'bunnyImage', 'splash/bunnyhover.webp', 'splash/bunny.webp', '#ff5757');
      });

      document.getElementById('bunnyHoverArea').addEventListener('mouseout', () => {
        handleImageLeave('bunnyImage', 'splash/bunny.webp');
      });

      // RN Modal Event Listeners
      const modalOverlay = document.getElementById('rnModalOverlay');
      const rnButton = document.querySelector('.nav-box.rn');
      const closeModal = document.getElementById('closeModal');
      const modalBody = document.getElementById('modalBody');

      function populateModal(data) {
        let bodyHtml = '';
        const introText = data.intro || data.description || '';
        if (introText) {
          if (data.instagramUrl && !introText.includes('href=')) {
            bodyHtml += `<p>${formatTextWithLinks(introText.replace('instagram', `<a href="${data.instagramUrl}" target="_blank" rel="noopener noreferrer" style="color: white; text-decoration: underline;">instagram</a>`))}</p>`;
          } else {
            bodyHtml += `<p>${formatTextWithLinks(introText)}</p>`;
          }
        }

        if (data.events && data.events.length > 0) {
          bodyHtml += '<ul>';
          data.events.forEach(event => {
            if (!event.title && !event.description) return;
            bodyHtml += '<li>';
            if (event.title) {
              if (event.link) {
                bodyHtml += `<span><a href="${event.link}" target="_blank" rel="noopener noreferrer" style="color: inherit; text-decoration: underline;">${event.title}</a></span>`;
              } else {
                bodyHtml += `<span>${event.title}</span>`;
              }
            }
            if (event.description) {
              bodyHtml += `<p>${formatTextWithLinks(event.description)}</p>`;
            }
            bodyHtml += '</li>';
          });
          bodyHtml += '</ul>';
        }

        modalBody.innerHTML = bodyHtml;
      }

      function loadModalData() {
        if (!GOOGLE_SHEET_ID_OR_URL || GOOGLE_SHEET_ID_OR_URL.trim() === '') {
          fetch('rn.json')
            .then(response => {
              if (!response.ok) throw new Error('No local rn.json');
              return response.json();
            })
            .then(data => populateModal(data))
            .catch(() => populateModal(DEFAULT_RN_DATA));
          return;
        }

        let sheetId = GOOGLE_SHEET_ID_OR_URL.trim();
        const match = sheetId.match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);
        if (match && match[1]) {
          sheetId = match[1];
        }

        let gid = '';
        const gidMatch = GOOGLE_SHEET_ID_OR_URL.match(/[#&]gid=([0-9]+)/);
        if (gidMatch && gidMatch[1]) {
          gid = gidMatch[1];
        }

        let gvizUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json&t=${Date.now()}`;
        if (GOOGLE_SHEET_TAB_NAME) {
          gvizUrl += `&sheet=${encodeURIComponent(GOOGLE_SHEET_TAB_NAME)}`;
        } else if (gid) {
          gvizUrl += `&gid=${gid}`;
        }

        fetch(gvizUrl)
          .then(response => {
            if (!response.ok) throw new Error('Network error fetching sheet');
            return response.text();
          })
          .then(text => {
            const parsed = parseGvizResponse(text);
            populateModal(parsed);
          })
          .catch(error => {
            console.warn('Could not load from Google Sheet, falling back to local/default data:', error);
            fetch('rn.json')
              .then(response => {
                if (!response.ok) throw new Error('No local rn.json');
                return response.json();
              })
              .then(data => populateModal(data))
              .catch(() => populateModal(DEFAULT_RN_DATA));
          });
      }

      if (rnButton) {
        rnButton.addEventListener('click', (e) => {
          e.preventDefault();
          modalOverlay.style.display = 'flex';
          rnButton.style.visibility = 'hidden'; // Hide button when open
          loadModalData(); // Refresh data on open
        });
      }

      if (closeModal) {
        closeModal.addEventListener('click', () => {
          modalOverlay.style.display = 'none';
          if (rnButton) rnButton.style.visibility = 'visible'; // Show button when closed
        });
      }

      // Close on click outside
      modalOverlay.addEventListener('click', (e) => {
        if (e.target === modalOverlay) {
          modalOverlay.style.display = 'none';
          if (rnButton) rnButton.style.visibility = 'visible'; // Show button when closed
        }
      });

      // Load data on init
      loadModalData();
    });

    // Fluid Scaling Logic
    function adjustScales() {
      const vw = window.innerWidth;
      const vh = window.innerHeight;

      // Font Size formula (derived from user data)
      let fontSize = 200;
      if (vw < 1143) {
        fontSize = Math.max(123, 0.277 * vw - 116);
      }

      // Scale formula (derived from user data based on vh)
      const scale = Math.max(0.5, 0.002 * vh + 0.07);

      // Apply styles
      document.querySelector('.title').style.fontSize = fontSize + 'px';
      document.querySelector('.images').style.transform = `translateX(-50%) scale(${scale})`;
    }

    window.addEventListener('resize', adjustScales);
    document.addEventListener('DOMContentLoaded', adjustScales);
  </script>
</body>

</html>
